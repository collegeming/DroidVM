name: Native input lifecycle candidate
on:
  workflow_dispatch:
  push:
    branches: [native-input-fd-ownership]
    paths: ['app/src/main/java/cn/classfun/droidvm/daemon/vm/backend/Native*', 'app/src/main/java/cn/classfun/droidvm/daemon/vm/SerialPipe*', 'app/src/test/**', 'scripts/ci/compile_native_input_bridge.py', 'scripts/ci/test_serial_pipe_regression.py', '.github/workflows/native-input-lifecycle.yml']
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test production descriptor owner
        run: |
          mkdir -p out/native-input-tests
          javac --release 11 -d out/native-input-tests \
            app/src/main/java/cn/classfun/droidvm/daemon/vm/backend/NativeInputSocketOwner.java \
            app/src/test/java/cn/classfun/droidvm/daemon/vm/backend/NativeInputSocketOwnerTest.java
          timeout 60s java -cp out/native-input-tests cn.classfun.droidvm.daemon.vm.backend.NativeInputSocketOwnerTest
      - name: Test serial pipe descriptor transfer
        run: |
          mkdir -p out/serial-pipe-tests
          javac --release 11 -d out/serial-pipe-tests \
            app/src/main/java/cn/classfun/droidvm/daemon/vm/SerialPipeFds.java \
            app/src/test/java/cn/classfun/droidvm/daemon/vm/SerialPipeFdsTest.java
          timeout 60s java -cp out/serial-pipe-tests cn.classfun.droidvm.daemon.vm.SerialPipeFdsTest
      - name: Regress actual SerialPipe against historical adoption and FD reuse failure
        run: python3 -I scripts/ci/test_serial_pipe_regression.py
      - name: Test Linux listener wake and source lifecycle contracts
        run: timeout 60s python3 -I app/src/test/python/test_native_input_listener.py
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
      - name: Compile actual bridge with Android SDK and declared dependency stubs
        run: |
          python3 -I scripts/ci/compile_native_input_bridge.py "$ANDROID_HOME/platforms/android-36/android.jar" out/native-input-compile
      - name: State validation scope
        run: |
          printf '%s\n' 'Production owner tests and Linux poll/HUP semantics only. Bridge SDK compilation uses dependency stubs; not full APK/JNI/device validation. Not proof of fdsan crash root cause or repair.'
