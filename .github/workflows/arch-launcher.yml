name: Arch launcher
on:
  workflow_dispatch:
  push:
    branches: [native-input-3348830]
    paths: ['companion/**', '.github/workflows/arch-launcher.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Build standalone launcher with Android SDK only
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          ANDROID="$ANDROID_HOME/platforms/android-36/android.jar"
          mkdir -p out/classes out/dex
          javac --release 11 -classpath "$ANDROID" -d out/classes $(find companion/src -name '*.java')
          "$BT/d8" --min-api 33 --lib "$ANDROID" --output out/dex $(find out/classes -name '*.class')
          "$BT/aapt2" link -o out/base.apk -I "$ANDROID" --manifest companion/AndroidManifest.xml -A companion/assets
          cp out/base.apk out/unsigned.apk
          (cd out/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 out/unsigned.apk out/aligned.apk
      - name: Sign with dedicated stable companion key
        env:
          KEYSTORE: ${{ secrets.ARCH_LAUNCHER_KEYSTORE }}
          KEY_PASS: ${{ secrets.ARCH_LAUNCHER_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$KEY_PASS"
          trap 'rm -f "$RUNNER_TEMP/arch-launcher.jks"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/arch-launcher.jks"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/arch-launcher.jks" --ks-pass env:KEY_PASS --key-pass env:KEY_PASS --out out/Arch-Linux-launcher.apk out/aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs out/Arch-Linux-launcher.apk
          sha256sum out/Arch-Linux-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Arch-Linux-launcher
          path: out/Arch-Linux-launcher.apk
