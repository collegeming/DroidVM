name: Native input validation
on:
  workflow_dispatch:
  push:
    branches: [native-input-3348830]
    paths: ['app/**', '.github/workflows/native-input-validation.yml']
permissions:
  contents: read
jobs:
  input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and compile input changes (not an upgrade of upstream APK)
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DroidVM-input-UNDEPLOYED-debug
          path: app/build/outputs/apk/debug/*.apk
